<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login</title>
</head>

<body>
	<form action="/api/submit" method="post" id="submitForm">
		<label>
			<b>Username</b>:
			<input type="text" name="username" id="usernameInput" autocomplete="name" required />
		</label>
		<button type="submit">Submit</button>
	</form>
</body>

</html>
